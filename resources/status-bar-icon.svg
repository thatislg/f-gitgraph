  <!-- Upper Branch Hexagon Node -->
  <polygon points="11.5,2.4 12.9,3.2 12.9,4.8 11.5,5.6 10.1,4.8 10.1,3.2" fill="none" stroke="currentColor" stroke-width="0.9" />

  <!-- Top Trunk Hexagon Node -->
  <polygon points="4.5,1.9 5.9,2.7 5.9,4.3 4.5,5.1 3.1,4.3 3.1,2.7" fill="none" stroke="currentColor" stroke-width="0.9" />
