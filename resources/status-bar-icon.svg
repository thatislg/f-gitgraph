  <line x1="4.5" y1="3.5" x2="4.5" y2="12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <!-- Upper feature branch -->
  <path d="M 4.5 5 C 4.5 4.3 5 4 6 4 L 11.5 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Lower feature branch -->
  <path d="M 4.5 9.5 C 4.5 8.9 5 8.5 6 8.5 L 9.5 8.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Base Trunk Hexagon Node -->
  <polygon points="4.5,10.9 5.9,11.7 5.9,13.3 4.5,14.1 3.1,13.3 3.1,11.7" fill="none" stroke="currentColor" stroke-width="0.9" />

  <!-- Lower Branch Hexagon Node -->
